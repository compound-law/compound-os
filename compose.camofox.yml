services:
  camofox:
    build:
      context: .
      dockerfile: Dockerfile.camofox
      args:
        CAMOFOX_BROWSER_IMAGE: "${CAMOFOX_BROWSER_IMAGE:-ghcr.io/redf0x1/camofox-browser:latest}"
    image: paperclip-camofox-browser:local
    container_name: paperclip-camofox
    restart: unless-stopped
    network_mode: host
    shm_size: "1gb"
    environment:
      CAMOFOX_HOST: "${CAMOFOX_HOST:-127.0.0.1}"
      CAMOFOX_PORT: "${CAMOFOX_PORT:-9377}"
      CAMOFOX_PROFILES_DIR: "/home/node/.camofox/profiles"
      CAMOFOX_DOWNLOADS_DIR: "/home/node/.camofox/downloads"
      CAMOFOX_API_KEY: "${CAMOFOX_API_KEY:-}"
      CAMOFOX_ADMIN_KEY: "${CAMOFOX_ADMIN_KEY:-}"
      CAMOFOX_MAX_SESSIONS: "${CAMOFOX_MAX_SESSIONS:-25}"
      CAMOFOX_MAX_TABS_PER_SESSION: "${CAMOFOX_MAX_TABS_PER_SESSION:-10}"
      CAMOFOX_ALLOW_PRIVATE_NETWORK: "${CAMOFOX_ALLOW_PRIVATE_NETWORK:-false}"
      CAMOFOX_VNC_HOST: "${CAMOFOX_VNC_HOST:-100.121.44.116}"
      CAMOFOX_VNC_TIMEOUT_MS: "${CAMOFOX_VNC_TIMEOUT_MS:-1800000}"
    volumes:
      - "${CAMOFOX_DATA_DIR:-/mnt/HC_Volume_104828609/camofox-browser}:/home/node/.camofox"
    security_opt:
      - no-new-privileges:true
