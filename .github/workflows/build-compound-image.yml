name: Build Compound Image

on:
  push:
    branches:
      - compound
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    concurrency:
      group: build-compound-image-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Mirror upstream's docker.yml: refresh the lockfile before the Docker
      # build. Upstream's Dockerfile uses --frozen-lockfile, but they don't
      # keep pnpm-lock.yaml perfectly in sync with every package.json change
      # on master — their own CI does this refresh, and we need to do the
      # same or the build fails inside pnpm install on any upstream commit
      # that shipped a package change without a lockfile bump.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Refresh lockfile for Docker build context
        run: |
          set -euo pipefail
          pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
          changed="$(git status --porcelain)"
          if [ -z "$changed" ]; then
            echo "Lockfile already matches package metadata."
            exit 0
          fi
          if printf '%s\n' "$changed" | grep -Fvq ' pnpm-lock.yaml'; then
            echo "Unexpected files changed during lockfile refresh:"
            echo "$changed"
            exit 1
          fi
          echo "Using refreshed pnpm-lock.yaml in the Docker build context."

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=compound-{{date 'YYYYMMDD-HHmmss'}}
            type=sha,prefix=compound-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # Pin to the `production` stage. Upstream added a later `cloud`
          # stage to the Dockerfile (used by their managed cloud image) and
          # Docker's default target is the last stage — without this line
          # the build silently retargets `cloud`, which needs setup we
          # don't have.
          target: production
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
